<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Wheel - Hors ligne</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 24px;
      background: radial-gradient(circle at 30% 20%, #2a1450 0%, transparent 55%),
                  radial-gradient(circle at 75% 80%, #0f3a2a 0%, transparent 55%), #0b0b10;
      color: #f2f2f5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .box { max-width: 560px; padding: 40px 32px; border-radius: 24px;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); }
    h1 { margin: 0 0 14px; font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: 1.1; }
    p { margin: 0; color: #b9b9c6; font-size: 1.1rem; line-height: 1.5; }
    p + p { margin-top: 12px; }
    strong { color: #fff; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Music Wheel est hors ligne</h1>
    <p>Le site est temporairement désactivé.</p>
    <p>Demande à <strong>Tristan</strong> de le remettre en ligne.</p>
  </div>
</body>
</html>
